<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vocab Vault (TOEIC/THAITEP)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #1e293b;
      padding: 16px;
    }
    @media (min-width: 640px) {
      .app-container {
        height: 92vh;
        max-height: 840px;
        border-radius: 16px;
        border: 1px solid #334155;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
    }
    header { text-align: center; padding-bottom: 10px; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.2rem; color: #38bdf8; }

    .nav-tabs { display: flex; gap: 8px; margin: 12px 0; }
    .nav-btn {
      flex: 1; padding: 8px; background: #0f172a; border: 1px solid #334155;
      color: #94a3b8; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;
    }
    .nav-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }

    .tab-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .view { display: none; height: 100%; flex-direction: column; }
    .view.active { display: flex; }

    /* Flashcard View */
    .flashcard {
      flex: 1; background: #0f172a; border: 2px dashed #38bdf8; border-radius: 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; text-align: center; cursor: pointer; margin-bottom: 12px; user-select: none;
    }
    .tag-group { display: flex; gap: 6px; margin-bottom: 8px; }
    .tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #334155; color: #94a3b8; }
    .tag-pos { background: #0284c7; color: #fff; font-weight: bold; }
    .word-text { font-size: 1.8rem; font-weight: bold; margin: 6px 0; }
    .meaning { font-size: 1.25rem; color: #4ade80; display: none; margin-top: 10px; font-weight: bold; }
    .grammar-tip { font-size: 0.8rem; color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 8px 12px; border-radius: 6px; margin-top: 12px; display: none; text-align: left; line-height: 1.4; border: 1px solid rgba(251, 191, 36, 0.2); }
    .example { font-size: 0.85rem; color: #94a3b8; margin-top: 8px; display: none; font-style: italic; }

    /* Form & Input */
    input, select, .action-btn {
      width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px;
    }
    .api-status { font-size: 11px; color: #38bdf8; margin-top: -4px; margin-bottom: 6px; display: block; min-height: 14px; }
    .action-btn { background: #0284c7; border: none; font-weight: 600; cursor: pointer; }

    /* List View */
    .vocab-list-container { flex: 1; overflow-y: auto; padding-right: 4px; }
    .list-item {
      background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;
    }
    .delete-btn { background: #ef4444; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Vocab Vault (TOEIC / THAITEP)</h1>
    </header>

    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('review')">🔀 ท่องศัพท์</button>
      <button class="nav-btn" onclick="switchTab('add')">➕ เพิ่มคำศัพท์</button>
      <button class="nav-btn" onclick="switchTab('list')">📚 คลัง (<span id="totalCount">0</span>)</button>
    </div>

    <div class="tab-content">
      <!-- 1. Flashcard View -->
      <div class="view active" id="view-review">
        <div class="flashcard" id="flashcard" onclick="toggleMeaning()">
          <div class="tag-group">
            <span class="tag" id="fcTag">หมวดหมู่</span>
            <span class="tag tag-pos" id="fcPos">POS</span>
          </div>
          <div class="word-text" id="fcWord">กดปุ่มเพื่อสุ่ม</div>
          <div class="meaning" id="fcMeaning">ความหมาย</div>
          <div class="grammar-tip" id="fcPosition">📌 ตำแหน่งในประโยค: -</div>
          <div class="example" id="fcExample"></div>
        </div>
        <button class="action-btn" onclick="getRandomWord()">🔀 คำถัดไป</button>
      </div>

      <!-- 2. Add Word View -->
      <div class="view" id="view-add">
        <input type="text" id="wordInput" placeholder="พิมพ์คำศัพท์ภาษาอังกฤษ (e.g. interrupt)" onblur="autoFetchAll()" onkeydown="if(event.key==='Enter') autoFetchAll()">
        <span class="api-status" id="apiStatus"></span>
        
        <input type="text" id="posInput" placeholder="ประเภทคำ (e.g. v., n.) — อัตโนมัติ">
        <input type="text" id="meaningInput" placeholder="ความหมายภาษาไทย — แปลให้อัตโนมัติ">
        <input type="text" id="positionInput" placeholder="ตำแหน่งในประโยคที่ออกสอบ — สรุปให้อัตโนมัติ">
        <input type="text" id="exampleInput" placeholder="ประโยคตัวอย่าง (ถ้ามี)">
        
        <select id="tagInput">
          <option value="TOEIC">TOEIC</option>
          <option value="THAITEP">THAITEP</option>
          <option value="General">ทั่วไป</option>
        </select>
        
        <button class="action-btn" style="background: #10b981;" onclick="addWord()">บันทึกคำศัพท์</button>
      </div>

      <!-- 3. List View -->
      <div class="view" id="view-list">
        <div class="vocab-list-container" id="vocabList"></div>
      </div>
    </div>
  </div>

  <script>
    // กฎไวยากรณ์และตำแหน่งในประโยคสำหรับข้อสอบ
    const grammarRules = {
      "n.": "ประธานต้นประโยค / กรรมหลัง Verb / หลัง Preposition / หลัง a, an, the, Possessive",
      "v.": "หลังประธาน / หลัง Modal verbs (can, must, will) / ในตำแหน่งกริยาแท้ของ Clause",
      "adj.": "หน้า Noun เพื่อขยายนาม / หลัง Verb to be หรือ Linking Verbs (seem, become)",
      "adv.": "หน้า Verb / หลังประโยค / ขยาย Adj (วางหน้า Adj) / หน้าประโยคแล้วคั่นด้วย comma"
    };

    const defaultVocab = [
      { 
        word: "interrupt", 
        pos: "v.", 
        meaning: "ขัดจังหวะ, รบกวน", 
        position: "หลังประธาน / หลัง Modal verbs (can, must, will) / ในตำแหน่งกริยาแท้ของ Clause", 
        example: "Please do not interrupt while she is speaking.", 
        tag: "THAITEP" 
      }
    ];

    let words = JSON.parse(localStorage.getItem("vocab_data")) || defaultVocab;

    function saveData() {
      localStorage.setItem("vocab_data", JSON.stringify(words));
      renderList();
    }

    function switchTab(tab) {
      document.querySelectorAll(".nav-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", ["review", "add", "list"][idx] === tab);
      });
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById(`view-${tab}`).classList.add("active");
    }

    // Auto-fetch Part of Speech + Auto Translate + Position in sentence
    async function autoFetchAll() {
      const word = document.getElementById("wordInput").value.trim();
      const statusEl = document.getElementById("apiStatus");
      if (!word) return;

      statusEl.innerText = "🔍 กำลังค้นหาข้อมูลและแปลภาษา...";

      let detectedPos = [];
      
      // 1. ดึง POS & Example จาก Dictionary API
      try {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (dictRes.ok) {
          const dictData = await dictRes.json();
          if (dictData[0]?.meanings) {
            const posMap = { noun: "n.", verb: "v.", adjective: "adj.", adverb: "adv.", preposition: "prep.", conjunction: "conj." };
            detectedPos = [...new Set(dictData[0].meanings.map(m => posMap[m.partOfSpeech] || m.partOfSpeech))];
            
            document.getElementById("posInput").value = detectedPos.join(", ");

            // ดึงตัวอย่างประโยค
            for (let m of dictData[0].meanings) {
              for (let d of m.definitions) {
                if (d.example && !document.getElementById("exampleInput").value) {
                  document.getElementById("exampleInput").value = d.example;
                  break;
                }
              }
            }
          }
        }
      } catch (e) {
        console.log("Dictionary error");
      }

      // 2. แปลความหมายเป็นภาษาไทยผ่าน Google Translate
      try {
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=th&dt=t&q=${encodeURIComponent(word)}`);
        if (transRes.ok) {
          const transData = await transRes.json();
          if (transData[0]?.[0]?.[0]) {
            document.getElementById("meaningInput").value = transData[0][0][0];
          }
        }
      } catch (e) {
        console.log("Translate error");
      }

      // 3. วิเคราะห์ตำแหน่งในประโยคอัตโนมัติตาม POS หลัก
      if (detectedPos.length > 0) {
        const mainPos = detectedPos[0];
        document.getElementById("positionInput").value = grammarRules[mainPos] || "พิจารณาตามบริบทของโครงสร้างประโยค";
      }

      statusEl.innerText = "✓ ดึงข้อมูลสำเร็จ!";
    }

    function addWord() {
      const word = document.getElementById("wordInput").value.trim();
      const pos = document.getElementById("posInput").value.trim() || "-";
      const meaning = document.getElementById("meaningInput").value.trim();
      const position = document.getElementById("positionInput").value.trim() || "-";
      const example = document.getElementById("exampleInput").value.trim();
      const tag = document.getElementById("tagInput").value;

      if (!word || !meaning) return alert("กรุณาใส่คำศัพท์และความหมาย");

      words.unshift({ word, pos, meaning, position, example, tag });
      saveData();

      document.getElementById("wordInput").value = "";
      document.getElementById("posInput").value = "";
      document.getElementById("meaningInput").value = "";
      document.getElementById("positionInput").value = "";
      document.getElementById("exampleInput").value = "";
      document.getElementById("apiStatus").innerText = "";
      switchTab("review");
      getRandomWord();
    }

    function deleteWord(index) {
      words.splice(index, 1);
      saveData();
    }

    function renderList() {
      const listEl = document.getElementById("vocabList");
      document.getElementById("totalCount").innerText = words.length;
      listEl.innerHTML = "";

      words.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "list-item";
        row.innerHTML = `
          <div>
            <strong>${item.word}</strong> 
            <span style="color:#38bdf8; font-size:11px;">[${item.pos || '-'}]</span>
            <span style="color:#94a3b8; font-size:11px;">(${item.tag})</span><br>
            <span style="color:#4ade80; font-size:13px;">${item.meaning}</span>
          </div>
          <button class="delete-btn" onclick="deleteWord(${index})">ลบ</button>
        `;
        listEl.appendChild(row);
      });
    }

    function getRandomWord() {
      if (words.length === 0) return;
      const rand = words[Math.floor(Math.random() * words.length)];
      document.getElementById("fcTag").innerText = rand.tag;
      document.getElementById("fcPos").innerText = rand.pos || "-";
      document.getElementById("fcWord").innerText = rand.word;
      document.getElementById("fcMeaning").innerText = rand.meaning;
      document.getElementById("fcPosition").innerText = `📌 ตำแหน่งในประโยค: ${rand.position || '-'}`;
      
      const exEl = document.getElementById("fcExample");
      if (rand.example) {
        exEl.innerText = `Ex: ${rand.example}`;
      } else {
        exEl.innerText = "";
      }

      // ซ่อนเฉลยไว้ก่อน
      document.getElementById("fcMeaning").style.display = "none";
      document.getElementById("fcPosition").style.display = "none";
      exEl.style.display = "none";
    }

    function toggleMeaning() {
      const meaning = document.getElementById("fcMeaning");
      const position = document.getElementById("fcPosition");
      const example = document.getElementById("fcExample");
      const isHidden = meaning.style.display === "none";

      meaning.style.display = isHidden ? "block" : "none";
      position.style.display = isHidden ? "block" : "none";
      if (example.innerText) example.style.display = isHidden ? "block" : "none";
    }

    renderList();
    getRandomWord();
  </script>
</body>
</html>
